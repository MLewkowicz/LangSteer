# 3D Diffuser Actor Policy — Isaac Sim variant of primitive+object conditioning
#
# Trained on Isaac Sim teleop demos via training/diffuser_actor_isaac. Replaces
# CLIP text embeddings with two small parallel embedding tables sized for the
# Isaac primitive/object vocabularies in
# training/policies/diffuser_actor/dataset_isaac.py.
#
# IMPORTANT: vocab sizes MUST match ISAAC_PRIMITIVE_VOCAB / ISAAC_OBJECT_VOCAB.
# When you add a new object, append it alphabetically in the dataset vocab and
# bump `num_objects` here.

name: diffuser_actor

ckpt_path: "checkpoints/diffuser_actor_isaac.pth"
device: "cuda"

# Architecture — same as the CALVIN primitive+object variant.  The CLIP-vision
# backbone, image_size, embedding_dim, etc. are fixed by the encoder geometry
# (see isaac_integration plan / encoder.py); only the conditioning vocab sizes
# change between Isaac and CALVIN.
backbone: clip
image_size: [256, 256]
embedding_dim: 192
num_vis_ins_attn_layers: 2
use_instruction: true       # reuses the instruction cross-attn pipeline
use_primitive_id: true
num_primitives: 2           # ISAAC_PRIMITIVE_VOCAB: grasp=0, place=1
use_object_id: true
num_objects: 2              # ISAAC_OBJECT_VOCAB (alphabetical): bowl=0, mug=1
fps_subsampling_factor: 3

# gripper_loc_bounds — *relative-frame* bounds (delta from current ee_pose).
# The model uses this to normalize three tensors against the same box:
#   1) gt_trajectory[:, :, :3]   — relativized by dataset_isaac.py
#                                  when dataset.relative_action=True
#   2) pcd_obs[..., :3]          — relativized in-model by convert2rel
#                                  when policy.relative=true
#   3) curr_gripper[..., :3]     — same; always zero after convert2rel
#
# Sizing rule: cover the trajectory + gripper-history delta range with a
# small margin. PCD background points outside this box clamp to ±1, which is
# the intended behaviour (see DiffuserActor.normalize_pos:333-334) — those
# clamp-saturated PCD values are still useful as "this pixel is far in
# direction X" cues.
#
# Earlier absolute-Isaac-world bounds were incompatible with relative=true:
# either pcd_obs clamped after convert2rel (when bounds = ee-only) or the
# normalised trajectory signal collapsed to a few percent of [-1, 1] (when
# bounds were widened to include PCD), drowning the diffusion noise schedule.
#
# Calibrated 2026-05-25 from all 83 demos / 40266 frames in
# data/isaac_sim_demos via:
#   uv run python scripts/compute_relative_gripper_loc_bounds_isaac.py \
#     --data_dir data/isaac_sim_demos --margin 0.10
# Raw delta extrema (union of trajectory, gripper-history, action-target):
#   min: [-0.1518, -0.1240, -0.1112]   max: [0.1473, 0.1599, 0.1598]
gripper_loc_bounds: [[-0.2518, -0.2240, -0.2112], [0.2473, 0.2599, 0.2598]]

rotation_parametrization: "6D"
quaternion_format: "wxyz"
diffusion_timesteps: 25
nhist: 3
relative: true
lang_enhanced: true

# Inference
pred_horizon: 20

# Camera setup — matches IsaacSimRecorder HDF5 layout.
cameras: ["static", "gripper"]

# Image preprocessing
crop_images: true

mask_language: false

# MCMC Langevin corrector (used with steering)
corrector_steps: 0
corrector_step_size: 0.001
