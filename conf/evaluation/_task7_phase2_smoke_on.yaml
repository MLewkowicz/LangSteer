# Task 7 Phase 2 smoke — scene_grounding.enabled=true. Captures the
# overhead frame, runs the grounding LMP, threads scene-context into
# the composer. Cache fresh — grounding output is new content.

condition_name: "Task7 Phase 2 (grounding on)"

policy_config: diffuser_actor_primitive_object

policy:
  ckpt_path: "checkpoints/object_primitive_ABCD.pth"
  mask_language: false

steering: voxposer

steering_overrides:
  loop_back_on_last_stage: true
  cache_dir: /tmp/task7_phase2_cache
  scene_grounding.enabled: true

tasks:
  - open_drawer
