# Same starting conditions as _rot_diag_left_off but with strong rotation
# steering. Pair with the off run to measure whether the steering biases
# the policy's committed direction.
condition_name: "ROT-DIAG left-only rot_strength=5 alpha_max=1.0"
policy_config: diffuser_actor_primitive_object
policy:
  ckpt_path: "checkpoints/object_primitive_ABCD.pth"
  mask_language: false
steering: voxposer
steering_overrides:
  loop_back_on_last_stage: true
  cache_dir: /tmp/rot_diag_cache
  guidance_strength_rot: 5.0
  rot_horizon_alpha_max: 1.0
  rot_horizon_floor: 0.1
tasks:
  - rotate_red_block_left
