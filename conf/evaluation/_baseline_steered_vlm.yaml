# baseline_steered.yaml + VLM scene grounding ON.
# Intended for P4 perturbed eval. Vanilla Diffuser Actor (full language
# conditioning) with VoxPoser steering layered on top, VLM grounding
# enabled so the composer/affordance prompts get scene context from a
# gpt-5.4-mini vision call at episode start.
condition_name: "Baseline + steering + VLM grounding (P4)"

policy:
  ckpt_path: "checkpoints/diffuser_actor_calvin.pth"
  mask_language: false

steering: voxposer

steering_overrides:
  loop_back_on_last_stage: true
  cache_dir: /tmp/baseline_steered_vlm_cache
  scene_grounding.enabled: true

# All 34 CALVIN tasks (P4 filter narrows to user-labeled valid starts)
tasks:
  # Rotation (6)
  - rotate_red_block_right
  - rotate_red_block_left
  - rotate_blue_block_right
  - rotate_blue_block_left
  - rotate_pink_block_right
  - rotate_pink_block_left
  # Push (6)
  - push_red_block_right
  - push_red_block_left
  - push_blue_block_right
  - push_blue_block_left
  - push_pink_block_right
  - push_pink_block_left
  # Slider (2)
  - move_slider_left
  - move_slider_right
  # Drawer (2)
  - open_drawer
  - close_drawer
  # Lift from table (3)
  - lift_red_block_table
  - lift_blue_block_table
  - lift_pink_block_table
  # Lift from slider (3)
  - lift_red_block_slider
  - lift_blue_block_slider
  - lift_pink_block_slider
  # Lift from drawer (3)
  - lift_red_block_drawer
  - lift_blue_block_drawer
  - lift_pink_block_drawer
  # Place (2)
  - place_in_slider
  - place_in_drawer
  # Push into drawer (1)
  - push_into_drawer
  # Stack/unstack (2)
  - stack_block
  - unstack_block
  # Lights (4)
  - turn_on_lightbulb
  - turn_off_lightbulb
  - turn_on_led
  - turn_off_led
