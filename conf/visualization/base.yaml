# @package _global_
# Base visualization configuration.
#
# Iter 2 of Task 5 trimmed this from 6 mode toggles + 6 sub-configs down to
# 3 toggles for the three surviving artifacts. Override per-renderer at the
# CLI:  visualization.live_costmap.enabled=true
#       visualization.video.enabled=true
#       visualization.html.enabled=true

visualization:
  # Stage HTML (Plotly 3D figures, one per stage activation).
  html:
    enabled: false
    save_dir: null      # null → use Hydra output dir at runtime
    quality: low        # 'low' | 'medium' | 'high'

  # Live tk costmap window — rotatable 3D viewer mirroring the active value
  # map alongside primitive / stage / step / instruction labels.
  live_costmap:
    enabled: false
    refresh_interval: 1     # tick the window every N env steps
    downsample: 4           # voxel-grid stride for affordance/avoidance scatters
    point_threshold: 0.05   # min normalized intensity to render a voxel

  # MP4 video recorder for the static + gripper cameras.
  video:
    enabled: false
    save_path: "outputs/videos"
    fps: 30
    codec: "mp4v"
    # Optional high-res overrides (does NOT affect policy inputs).
    # 0 = use native camera resolution (200×200 static, 84×84 gripper).
    static_record_width: 0
    static_record_height: 0
    gripper_record_width: 0
    gripper_record_height: 0
    static_camera_fov: null   # null = native CALVIN FOV (10°)
    # Anti-aliasing / background for the static re-render (policy inputs unaffected).
    static_supersample: 1     # SSAA factor: render at ss× then downscale (INTER_AREA)
    white_background: false   # composite white over floor-plane + void (seg-mask)
    render_backend: tiny      # 'tiny' (software + SSAA) | 'egl' (hardware MSAA + shadows)
    depth_margin: null        # tighten near/far to cam_dist±margin (fixes block z-fighting); null=native
