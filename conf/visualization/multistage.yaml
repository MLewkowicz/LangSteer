# @package _global_
# Visualization config for multi-stage task recording.
# Enables MP4 video recording of both cameras at high resolution; all other
# modes off. Trimmed by iter 2 of Task 5 to the surviving video block.

visualization:
  html:
    enabled: false

  live_costmap:
    enabled: false

  video:
    enabled: true
    save_path: "outputs/videos"
    fps: 15
    codec: "mp4v"
    # Record cameras at high resolution via PyBullet re-render.
    # Does NOT affect policy inputs.
    static_record_width: 600
    static_record_height: 600
    gripper_record_width: 300
    gripper_record_height: 300
    # Optional FOV override for static camera re-renders (degrees).
    # null = use CALVIN's native 10°. Increase to ~20-30° to see full robot arm.
    static_camera_fov: 20
