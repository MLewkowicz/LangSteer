name: voxposer

# Steering instruction override (null = use env.task_description or top-level instruction)
# Set this to use a DIFFERENT instruction for value map generation than the policy sees.
instruction: null

# Guidance parameters
guidance_strength: 1

# .7 seems to be working for lift

horizon: ${policy.pred_horizon}
# Must be 'epsilon' for DiffuserActor (which uses epsilon prediction)
prediction_type: epsilon
device: ${policy.device}

# Guidance mode:
#   'epsilon' — add gradient correction to ε before the scheduler step (no loop changes)
#   'dps'     — apply correction to x_{t-1} after the scheduler step (DPS-style)
guidance_mode: epsilon

# Only apply guidance for timesteps <= this value.
# Steps above this threshold are high-noise; Tweedie x_0 predictions are unreliable there.
# E.g. with 100 total steps, set to 50 to guide only the lower-noise half.
start_guidance_timestep: 50

# Timestep scaling (soft ramp within the guided window)
use_timestep_scaling: true
min_timestep_scale: 0.1

# Adaptive guidance decay — fades guidance as the EE enters the affordance
# basin so the primitive-conditioned policy can drive through (e.g. complete
# the push motion past the basin centroid). Both modes are opt-out; with both
# disabled, behavior is identical to before.
#
# A. Distance-decay: linear ramp on ||ee - stage_target||.
#    d ≥ distance_full → scale = 1.0 (full guidance, EE far)
#    d ≤ distance_near → scale = distance_floor (EE in basin, near full release)
use_distance_scaling: true
distance_full: 0.12   # m: above this, full guidance
distance_near: 0.04   # m: below this, guidance reduced to distance_floor
distance_floor: 0.1  # residual fraction once EE is in basin
#
# B. Step-decay: linear ramp on env-steps spent in the current stage. Catches
#    cases where the basin centroid is offset from the contact point and the
#    EE never gets close enough to trigger distance decay.
use_step_scaling: false
step_full: 0          # full guidance for the first `step_full` env steps
step_decay: 80        # ramp length (env steps) from 1.0 down to step_floor
step_floor: 0.05

# Rotation guidance — opt-in per stage. When a composer stage emits a 5-tuple
# `(aff_fn, avoid_fn, rot_target, mode, primitive)` with rot_target != None,
# the steering module nudges the predicted wrist rotation toward the target
# via Tweedie's formula in 6D rotation space. All knobs below are no-ops on
# stages without a rotation target, so existing rollouts behave identically.
guidance_strength_rot: .4   # default to position strength
start_guidance_timestep_rot: ${.start_guidance_timestep}
# Alignment-decay: shrink rotation guidance as the predicted rotation aligns
# with the target (measured by Frobenius distance ||R_pred − R_target||_F,
# bounded ≤ 2*sqrt(2) ≈ 2.83). 0.5 ≈ 30°, 0.1 ≈ 6°.
use_rot_alignment_scaling: true
rot_align_full: 0.5
rot_align_near: 0.1
rot_align_floor: 0.05
# Per-horizon SLERP fraction range for rotation guidance. The rotation pull
# computes a per-horizon target as SLERP(R_pred_h, R_target, alpha_h) along
# the SO(3) geodesic, with alpha_h ramping quadratically from
# `rot_horizon_floor` (h=0) up to `rot_horizon_alpha_max` (h=H-1).
#
# `rot_horizon_alpha_max` is the most important knob — it controls how far
# the predicted trajectory's endpoint reaches along the geodesic per
# policy call:
#   1.0 = "complete the full rotation in this trajectory" — but a 16-step
#     waypoint sweep through 90° is much faster than the training
#     distribution, so the IK can't track it smoothly (wrist pitches
#     between waypoints).
#   0.3 = "advance ~30% of the remaining rotation per trajectory" — closer
#     to demo motion speed; convergence accumulates over many env steps.
# The floor keeps a small pull on h=0 so the trajectory starts rotating
# immediately rather than holding pose for one waypoint.
rot_horizon_floor: 0.0
rot_horizon_alpha_max: 0.6
# Quaternion-hemisphere fix in the per-horizon SLERP. When true (default,
# legacy behavior), q_target is flipped to share q_pred's hemisphere so SLERP
# takes the short way in quaternion space. When false, the sign is left
# unchanged — useful when the policy has a directional bias that the short-
# way SLERP is locking in (the steering can't pull across the antipodal
# boundary because the SLERP target keeps following the prediction).
# (Only consulted when rot_guidance_method == "slerp".)
rot_hemisphere_fix: true

# Rotation-guidance method. Three options, swappable for A/B debugging:
#   slerp   — per-horizon quaternion SLERP toward R_target (legacy default).
#             Subject to the quaternion hemisphere ambiguity above.
#   tangent — log/exp map on SO(3). Equivalent to SLERP on the manifold but
#             the gradient direction is unambiguous: R_target alone determines
#             which way the prediction is pulled (no q_pred hemisphere
#             dependency). Use when "always commits to the wrong direction"
#             behavior is observed under slerp.
#   inject  — at t ≤ rot_inject_below_timestep, return an analytical ε-delta
#             that drives Tweedie's x₀_rot all the way to the per-horizon
#             target instead of nudging it. Heavy-handed; bypasses gradient
#             classifier-guidance entirely. Above the threshold, falls back
#             to the tangent path.
rot_guidance_method: slerp
# Only used by rot_guidance_method == "inject".
rot_inject_below_timestep: 20

# DiffuserActor position normalization bounds (gripper_loc_bounds).
# These are in gripper-relative space (same as policy.gripper_loc_bounds).
# Required for correct world-space denormalization of predicted trajectories.
gripper_loc_bounds: ${policy.gripper_loc_bounds}
relative: ${policy.relative}

# Multi-stage: proximity threshold (meters) for advancing to the next stage.
# When the EE is within this distance of the current stage's affordance target,
# the steering module switches to the next stage's cost map.
stage_proximity_threshold: 0.1

# Grasp-completion gate. For stages with primitive='grasp', proximity alone is
# not enough — the gripper must also have settled around an object before the
# steering advances to the next stage (otherwise lift/place launches around an
# empty gripper while the policy is still mid-attempt).
#
# A grasp counts as "complete" when the last `grasp_stability_window` gripper
# widths all fall in (`grasp_min_width`, `grasp_max_width`) — lower bound
# rejects "closed on nothing" (width≈0), upper bound rejects "still fully open
# hovering near object" (Franka opens to ~0.08m) — and their spread is under
# `grasp_stability_eps` (rejects "still closing" frames). Defaults tuned for
# CALVIN's Franka gripper.
grasp_min_width: 0.02         # m: below this → closed on nothing
grasp_max_width: 0.07         # m: above this → gripper still open
grasp_stability_window: 1     # consecutive steps the width must be stable
grasp_stability_eps: 0.002    # m: max spread allowed across the window

# Primitive-id conditioning is driven by the composer LLM: every stage tuple
# the composer emits carries its own primitive name in the 4th slot, drawn
# from the canonical vocabulary {grasp, push, pull, place}. The steering
# module reads that name per stage and (if a callback is registered) calls
# policy.set_primitive(id) so the base model swaps its conditioning embedding.
# No static schema lookup is performed at inference.

# Dynamic costmap refresh: re-evaluate value maps with current scene state.
# Uses cached LLM code with updated object positions (no new LLM call).
# Only stages marked 'track' are re-evaluated; 'static' stages are pinned at
# activation regardless of refresh.
refresh_costmap: true
refresh_interval: 1  # refresh every N environment steps

# Last-stage loop-back failure recovery. After `last_stage_dwell_steps`
# policy-iters spent at the last stage without the success oracle ending the
# episode, restart from stage 0 (reusing the composer's already-parsed stages
# — no new LLM call). Default OFF: at the current eval budget (max_steps=120,
# pred_horizon=20 → 6 policy-iters/episode) the mechanism cannot distinguish
# "policy stuck" from "policy completing slowly" and fires during legitimate
# last-stage execution (empirically observed close_drawer regression). Kept
# wired for opt-in research under different eval params.
loop_back_on_last_stage: false
last_stage_dwell_steps: 4        # policy-iters at last stage before reset
                                 # (was 3; bumped to 4 in Task 4 to avoid cutting
                                 # short slow-legit tasks like close_drawer while
                                 # still recovering oscillation cases like
                                 # lift_red_block_drawer. With max_steps=360 →
                                 # 18 policy-iters/ep, dwell=4 leaves a 14-iter
                                 # recovery budget after the first fire.)
max_loop_backs: 3                # safety cap so a stuck rollout still ends

# Default stage mode for legacy 2-tuple LLM outputs (no 3rd element).
# 'static' = freeze affordance at first activation (safe — never chases moving
#   offsets like "15cm to the left of the slider handle").
# 'track'  = re-evaluate each refresh (correct only for "at object" queries
#   where the affordance should follow the moving object).
default_stage_mode: static

# Voxel map settings
map_size: 100

# LLM settings (provider-agnostic: "anthropic" or "openai")
llm_provider: openai 
llm_model: gpt-5.4-mini  # was gpt-4o → gpt-5-chat-latest → gpt-5.4-mini (user correction 2026-05-18).
                         # gpt-5.4-mini requires `max_completion_tokens` instead of `max_tokens` and
                         # rejects server-side `stop` sequences. voxposer/lmp.py::_call_openai handles
                         # both per-model — passes max_completion_tokens for gpt-5* and truncates at
                         # stop markers client-side.
llm_temperature: 0
llm_max_tokens: 512
cache_dir: cache/voxposer_llm
load_cache: true

# Workspace bounds (absolute world coords, meters)
workspace_bounds_min: [-0.35, -0.60, 0.30]
workspace_bounds_max: [0.35, 0.15, 0.85]

# (Task 5 iter 3 moved HTML visualization config to
# `visualization.html.*` — the steering module no longer owns this. Enable
# stage HTMLs via `visualization.html.enabled=true`; configure save_dir /
# quality at `visualization.html.save_dir` / `visualization.html.quality`.)

# Task 7 Phase 2 — VLM scene grounding. When `enabled=true`, the runner
# captures an annotated overhead frame at episode start, sends it to the
# `scene_grounding` LMP (gpt-5.4-mini per Phase 0 audit), and threads the
# resulting dict as text context into the composer + affordance LMPs.
# Output schema (narrowed per Phase 0 pivot):
#     {'blocks_visible': {...}, 'ambiguous_resolutions': {...}}
# Fixture state (drawer open/closed, slider position, lights) is NOT in
# scope — it's read deterministically from scene_obs.
scene_grounding:
  enabled: false                # opt-in; default keeps text-only path
  model: gpt-5.4-mini           # locked per Phase 0 audit
  image_width: 600              # annotated frame size for VLM
  image_height: 600
  image_fov: 20.0               # degrees; matches Task 5's multistage default
  annotate: true                # OBB + name overlay (identity + geometry only)
  fallback_on_error: true       # on GroundingValidationError, fall back to text-only
