# Diffuser Actor training on Isaac Sim teleop demos for bowl-into-cabinet
# (primitive+object policy). Inherits from diffuser_actor_isaac; overrides
# data paths and gripper_loc_bounds for the 171-episode bowl dataset.

defaults:
  - diffuser_actor_isaac

dataset:
  train_path: /media/aryannav/Backup/isaac_sim_demos_bowl/training
  val_path: /media/aryannav/Backup/isaac_sim_demos_bowl/validation

policy:
  # Recomputed 2026-05-26 via scripts/compute_relative_gripper_loc_bounds_isaac.py
  # on the 171-episode bowl dataset (53705 frames). Raw delta extrema (union of
  # trajectory, gripper-history, action-target):
  #   min: [-0.1599, -0.0992, -0.1141]   max: [0.1796, 0.1688, 0.1702]
  # Margin: 0.10 m per side.
  gripper_loc_bounds: [[-0.2599, -0.1992, -0.2141], [0.2796, 0.2688, 0.2702]]

checkpoint_dir: outputs/checkpoints/diffuser_actor_isaac_bowl
experiment_name: diffuser_actor_isaac_bowl_${now:%Y%m%d_%H%M%S}
