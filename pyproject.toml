[project]
name = "langsteer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "robot-descriptions",
    "trimesh",
    "viser",
    "xacrodoc",
    "yourdfpy",
    "hydra-core>=1.3.2",
    "numpy>=2.2.6",
    "torch>=2.10.0",
    "calvin-env @ git+https://github.com/mees/calvin_env.git",
    "diffusers>=0.36.0",
    "transformers>=5.2.0",
    "accelerate>=1.12.0",
    "huggingface-hub>=1.4.1",
    "plotly>=6.5.2",
    "dash>=2.18.0",
    "pyrender>=0.1.45",
    "trimesh>=4.11.2",
    "zarr>=2.18.3",
    "rich>=14.3.2",
    "typer>=0.23.0",
    "pyopengl",
    "dill>=0.3.8",
    "einops>=0.7.0",
    "termcolor>=2.4.0",
    "numcodecs>=0.12.0",
    "scipy>=1.12.0",
    "tqdm>=4.65.0",
    "clip",
    "anthropic>=0.84.0",
    "openai>=2.27.0",
    "blosc>=1.11.4",
    "h5py>=3.16.0",
    "wandb>=0.25.1",
    "pyspacemouse>=2.0.0",
    "opencv-python-headless>=4.13.0.92",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.0",
]
calvin = [
    "calvin-env @ git+https://github.com/mees/calvin_env.git",
]
diffusion = [
    "diffusers>=0.21.0",
]
sagemaker = [
    "sagemaker>=3.0",
    "boto3",
]
[project.optional-dependencies]
camera = [
    "pyzed>=5.2",
    "opencv-python>=4.5",
]
robot = [
    "franky-control",
    "pyzed>=5.2",
    "threedmouse",
]
[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "envs*", "policies*", "steering*", "training*", "forecasters*", "utils*", "visualization*", "voxposer*"]
exclude = ["calvin*", "3D-Diffusion-Policy*", "3d_diffuser_actor*", "conf*"]

[tool.uv.sources]
pyopengl = { git = "https://github.com/mmatl/pyopengl.git", rev = "76d1261adee2d3fd99b418e75b0416bb7d2865e6" }
clip = { git = "https://github.com/openai/CLIP.git" }
pyzed = { url = "https://download.stereolabs.com/zedsdk/5.2/whl/linux_x86_64/pyzed-5.2-cp310-cp310-linux_x86_64.whl" }
franky-control = { url = "https://github.com/nickswalker/franky/releases/download/wheels-libfranka-0.21.1/franky_control-1.1.3+impedance.libfranka.0.21.1-cp310-cp310-manylinux_2_28_x86_64.whl" }
# zero-franky is a path dep at ../zero_franky — install separately on the robot:
#   uv pip install -e ../zero_franky
# Not declared here so non-robot machines can `uv sync` without the path existing.

[tool.hatch.build.targets.wheel]
packages = ["."]
